<!doctype html>
<!--
  `theme-ivory` carries the site's Ivory design (src/assets/css/ivory.css).
  It sits on <html> in the template, so every prerendered page and the dev
  server get it statically — no JavaScript decides the theme, and there is no
  flash of the previous design before hydration. The pilot applied it to tour
  routes only, from scripts/prerender.js and Layout.jsx; both of those hooks
  are gone now that the theme is site-wide.
-->
<html lang="en" class="theme-ivory">
  <head>
    <meta charset="UTF-8" />

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-WRWJ35WXX5"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-WRWJ35WXX5');
    </script>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/img/hikasustravel.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tours in Georgia, Armenia and Azerbaijan | Hikasus Travel</title>
    <meta name="description" content="Private and group tours in Georgia, Armenia and Azerbaijan, plus combined Caucasus itineraries. A local guide on every tour; private trips on your dates." />
    <meta name="keywords" content="Georgia tours, Armenia tours, Azerbaijan tours, Caucasus travel, private tours Caucasus, group tours Caucasus, combined Caucasus itinerary, book tour Georgia" />
    <link rel="canonical" href="https://www.hikasustravel.com/en/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hikasus Travel" />
    <meta property="og:title" content="Tours in Georgia, Armenia and Azerbaijan | Hikasus Travel" />
    <meta property="og:description" content="Private and group tours in Georgia, Armenia and Azerbaijan, plus combined Caucasus itineraries. A local guide on every tour; private trips on your dates." />
    <meta property="og:url" content="https://www.hikasustravel.com/en/" />
    <meta property="og:image" content="https://www.hikasustravel.com/images/files/georgia-home.jpg" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="es_ES" />
    <meta property="og:locale:alternate" content="fr_FR" />
    <meta property="og:locale:alternate" content="de_DE" />
    <meta property="og:locale:alternate" content="pl_PL" />
    <meta property="og:locale:alternate" content="cs_CZ" />
    <meta property="og:locale:alternate" content="nl_NL" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tours in Georgia, Armenia and Azerbaijan | Hikasus Travel" />
    <meta name="twitter:description" content="Private and group tours in Georgia, Armenia and Azerbaijan, plus combined Caucasus itineraries. A local guide on every tour; private trips on your dates." />
    <meta name="twitter:image" content="https://www.hikasustravel.com/images/files/georgia-home.jpg" />

    <!-- Geo tags are NOT in this template. They used to be, hardcoded to the
         company address in Tbilisi, which meant every prerendered page -- every
         Georgian region, every Armenian one, every hub -- claimed Tbilisi's
         coordinates. scripts/prerender.js now emits them per page from the
         record's own `geoMeta`, and a page with no single real location (a hub,
         an index) gets none rather than a false one. -->

    <!-- No webfonts: the Ivory theme is Verdana. See src/assets/css/ivory.css. -->

    <!-- Structured Data: TravelAgency -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "TravelAgency",
      "name": "Hikasus Travel",
      "legalName": "Hikasus Travel LTD",
      "foundingDate": "2024",
      "url": "https://www.hikasustravel.com",
      "logo": "https://www.hikasustravel.com/img/hikasustravel.svg",
      "image": "https://www.hikasustravel.com/images/files/georgia-home.jpg",
      "description": "Hikasus Travel is a Tbilisi-based tour operator running private and group tours in Georgia, Armenia and Azerbaijan — single-country trips or combined Caucasus itineraries. Every tour runs with a local guide; private trips are built around your own dates, route and trip length.",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "111a Vakhtang Gorgasali Street",
        "addressLocality": "Tbilisi",
        "postalCode": "0114",
        "addressCountry": "GE"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 41.7151,
        "longitude": 44.8271
      },
      "telephone": ["+995 551 098 077", "+32 468 32 06 98"],
      "email": "info@hikasustravel.com",
      "sameAs": [
        "https://www.instagram.com/hikasus_travel",
        "https://www.tripadvisor.com/Attraction_Review-g294195-d33097839-Reviews-Hikasus_Travel-Tbilisi.html"
      ],
      "areaServed": [
        { "@type": "Country", "name": "Georgia" },
        { "@type": "Country", "name": "Armenia" },
        { "@type": "Country", "name": "Azerbaijan" }
      ],
      "priceRange": "$$"
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>if(location.hash.startsWith('#/'))location.replace(location.hash.slice(1))</script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
